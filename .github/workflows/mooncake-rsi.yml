name: Mooncake bot and bounded RSI

on:
  pull_request:
    paths:
      - 'tools/mooncake-bot/**'
      - '.github/workflows/mooncake-rsi.yml'
  push:
    branches: ['sima/mooncake-rsi']
    paths:
      - 'tools/mooncake-bot/**'
      - '.github/workflows/mooncake-rsi.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/mooncake-bot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check mooncake_bot tests
      - run: ruff format --check mooncake_bot tests
